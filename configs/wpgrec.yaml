seed: 42
device: cuda

dataset:
  max_len: 200
  min_len: 2

model:
  d: 64
  wavelet: db4
  depth_l: 2        # l in paper, number of SWPT levels, B=2^l
  tau: 4            # boundary token length
  attn_hidden: 128

graph:
  Lg: 2
  K: 2

train:
  epochs: 200
  batch_size: 128
  lr: 0.005
  weight_decay: 1.0e-4
  early_stop_patience: 10
  lambda_gate: 1.0e-5
  full_softmax_chunk: 0   # 0 = no chunking; else chunk size for items

eval:
  Ks: [10, 20]
