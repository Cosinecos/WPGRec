[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpgrec"
version = "0.1.0"
description = "Data preprocessing utilities for WPGRec"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Peilin Liu"},
  {name = "Zhiquan Ji"},
  {name = "Gang Yan"}
]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.23"
]

[project.scripts]
wpgrec-preprocess = "wpgrec.cli.preprocess:main"
